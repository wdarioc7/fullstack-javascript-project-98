env:
  node: true
  es2022: true
extends:
  - airbnb-base
parserOptions:
  ecmaVersion: latest
  sourceType: module

rules:
  no-console: 0
  import/extensions:
   - off
  import/prefer-default-export: 
   - off
  no-underscore-dangle: [2, {"allow": ["__filename", "__dirname"]}]
  no-plusplus: 
   - off
